<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - RPG Mike e Caio</title>
</head>
<body class="fundo-login">
    <header class="cabecalho">
        <div class="logo">
            <h1>RPG Mike e Caio</h1>
        </div>
        <nav class="menu-login">
            <a href="index.html" class="btn-link">Página Inicial</a>
        </nav>
    </header>


    <!-- Área exclusiva do formulário de login -->
     <main class="container-login">
        <div class="caixa-login">
            <form>
                <label for="usuario">Usuário ou E-mail</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">

                <label for="senha>">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
        </div>
     </main>
    
</body>
</html>
